# PromptGuard self-hosted stack.
#
#   Proxmox (now):  HTTP on the LAN. Leave SITE_ADDRESS=:80 and set
#                    SESSION_COOKIE_SECURE=false in .env.
#   Hetzner (later): set SITE_ADDRESS=promptguard.example.com (a domain whose
#                    DNS points at the server) and SESSION_COOKIE_SECURE=true.
#                    Caddy then provisions Let's Encrypt HTTPS automatically.
#
# Copy .env.example -> .env and fill it in, then: docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promptguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-promptguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptguard} -d ${POSTGRES_DB:-promptguard}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./dashboard
      args:
        # NEXT_PUBLIC_* is baked at build time — rebuild after changing this.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-promptguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-promptguard}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ random chars) in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      NODE_ENV: production
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
